# Local (docker-compose k3s) only. The services admit the whole k3s pod CIDR 10.42.0.0/16 on their
# user port (the local allowlists), and traefik injects the fixed identity; these policies narrow
# that port to the traefik pods so no other pod can send X-Forwarded-User itself. The other ports
# (service, agent, ingest and admin listeners, bearer-gated) stay open to namespace agents.
# Selectors are the pod template labels the local render produces
# (tests/test_local_environment.py: test_networkpolicies_select_rendered_pods). A policy that
# selects no pod (a release off by profile) is inert.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-orchestrator-api-local
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agents-orchestrator
      app.kubernetes.io/instance: agents-orchestrator
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agents
      ports:
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8002

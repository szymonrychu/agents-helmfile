# Bootstraps by importing agent_orchestrator from the old cluster over verified
# TLS. CNPG generates the agents-orchestrator-db-cluster-app Secret (uri, ...).
mode: recovery
recovery:
  method: import
  database: agents_orchestrator
  owner: agents_orchestrator
  import:
    type: microservice
    databases:
      - agent_orchestrator
    source:
      host: agent-orchestrator-db-cluster-rw
      port: 5432
      username: agent_orchestrator
      database: agent_orchestrator
      sslMode: verify-full
      passwordSecret:
        create: false
        name: agent-orchestrator-db-cluster-app
        key: password
      sslRootCertSecret:
        name: agent-orchestrator-db-cluster-ca
        key: ca.crt

version:
  postgresql: "16"

cluster:
  # renovate: image=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15-standard-bookworm@sha256:4f151a9907fd7e8e487e4dc28c53e84b3bced2bd77a1590c0daaf237bd9bc4d9
  # The barman cloud plugin sidecar image comes through the Harbor proxy.
  imagePullSecrets:
    - name: regcred
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
  # Chart 0.9.0 reads the target database and owner of an import from
  # cluster.initdb, not from recovery.database/owner.
  initdb:
    database: agents_orchestrator
    owner: agents_orchestrator
  enablePDB: false
  instances: 1
  storage:
    size: 5Gi
    storageClass: rook-ceph

  walStorage:
    enabled: true
    size: 2Gi
    storageClass: rook-ceph

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

  monitoring:
    enabled: false


backups:
  enabled: true
  provider: s3
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  s3:
    region: eu-central-1
    bucket: database-backup-szymonrychu
    path: /agents-orchestrator-db/
    # accessKey / secretKey come from default.secrets.yaml (SOPS)
  retentionPolicy: "30d"
  scheduledBackups:
    - name: daily-backup
      schedule: "0 0 3 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io

image:
  repository: harbor.szymonrichert.pl/containers/agents-vault
  # Release tag X.Y.Z (git tag vX.Y.Z), never a sha7: Harbor retention prunes sha7 tags.
  tag: "0.2.0"

# Connection URI from the CNPG app Secret made by the agents-vault-db release.
postgres:
  existingSecret: agents-vault-db-cluster-app
  existingSecretKey: uri

# The vault's service token toward the orchestrator (orchestrator.token) comes from
# default.secrets.yaml (SOPS); the orchestrator holds its sha256. Port 8002 takes bearer service
# tokens; the orchestrator's port 8000 would answer 403 from its CIDR allowlist. The vault asks it
# for presets (attachments) and sessions (sweeper).
orchestrator:
  url: http://agents-orchestrator-services:8002

# The service listener's bearer token list is the raw Secret agents-vault-service-tokens (key
# tokens), applied by the release hook from values/agents-vault/raw/. The orchestrator holds the
# same value as vault.token (stage 2); it differs from the orchestrator token above.
serviceListener:
  tokensSecret:
    name: agents-vault-service-tokens
    key: tokens

# Only the oauth2-proxy sidecar (podAnnotations below) reaches the web api, over 127.0.0.1.
# Widening this bypasses SSO.
allowedCidrs:
  - 127.0.0.1/32

# SSO (oauth2-proxy admission webhook) on the web pod only; the service listener (orchestrator,
# bearer token) and the sweeper stay unannotated.
components:
  web:
    podAnnotations:
      oauth2-proxy-admission/enable: "true"
      oauth2-proxy-admission/redeem-url: "http://keycloak.authentication.svc.cluster.local/realms/master/protocol/openid-connect/token"
      oauth2-proxy-admission/secret-name: agents-orchestrator-proxy
      oauth2-proxy-admission/secret-namespace: agents

# Shares the lab host and its certificate with agents-orchestrator (agents-orchestrator-tls, owned
# by that release's cert-manager annotation), so no cert-manager annotation here.
ingress:
  enabled: true
  className: nginx
  # The chart has no denySourceRanges key, so the ingress-nginx denylist is set directly. The
  # cluster node IPs (kubectl get nodes -o wide): agent pods egress SNATed to these.
  annotations:
    nginx.ingress.kubernetes.io/denylist-source-range: "192.168.1.26/32,192.168.1.27/32,192.168.1.28/32,192.168.1.29/32,192.168.1.65/32"
  hosts:
    - host: lab.szymonrichert.pl
      paths:
        - path: /vault
          pathType: Prefix
  tls:
    - secretName: agents-orchestrator-tls
      hosts:
        - lab.szymonrichert.pl

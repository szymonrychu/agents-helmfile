image:
  repository: harbor.szymonrichert.pl/containers/agent-orchestrator
  # CI-published sha7 tag, equal to the chart appVersion.
  tag: f1baa5b

# claude-code-wrapper image of the agent pods (becomes ORCH_AGENT_IMAGE).
agentImage: harbor.szymonrichert.pl/containers/claude-code-wrapper:1ced775

# Connection URI from the CNPG app Secret made by the agent-orchestrator-db release.
# No password in plain values.
postgres:
  existingSecret: agent-orchestrator-db-cluster-app
  existingSecretKey: uri

# masterKey.value and claude.token come from default.secrets.yaml (SOPS).

env:
  # ingress-nginx is hostNetwork; on this flannel cluster its connection to the api pod arrives from the
  # node's pod-network gateway (10.244.N.0 via flannel.1 from another node, 10.244.N.1 via cni0 on the same
  # node), not a 192.168.1.x node IP. Allow each node's podCIDR .0/31 (kubectl get nodes -o
  # jsonpath='{.items[*].spec.podCIDR}', one 10.244.N.0/24 per node); agent pods (.2 and up) stay refused.
  # The list tracks the node set: one /31 per node, so adding or removing a node changes it. The ingress
  # whitelist keeps access LAN-only.
  ORCH_ALLOWED_CIDRS: 10.244.0.0/31,10.244.1.0/31,10.244.2.0/31,10.244.3.0/31,10.244.4.0/31
  ORCH_AGENT_IMAGES: harbor.szymonrichert.pl/containers/claude-code-wrapper:1ced775
  # WebSocket upgrades must carry an Origin in this list: the UI origin (the ingress host over https).
  ORCH_ALLOWED_ORIGINS: https://agents.szymonrichert.pl
  # Every new session starts with any-mcp, installed by the rendered onStart hook (pinned tag).
  ORCH_ANY_MCP_REPO: https://github.com/szymonrychu/any-mcp
  ORCH_ANY_MCP_REF: v0.1.0

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
    # SSE streams stay open.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  # Cluster node IPs (kubectl get nodes -o wide): agent pods egress SNATed to these.
  denySourceRanges:
    - 192.168.1.26/32
    - 192.168.1.27/32
    - 192.168.1.28/32
    - 192.168.1.29/32
    - 192.168.1.65/32
  allowSourceRanges:
    - 192.168.1.0/24
  hosts:
    - host: agents.szymonrichert.pl
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: agent-orchestrator-tls
      hosts:
        - agents.szymonrichert.pl

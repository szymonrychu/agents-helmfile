image:
  repository: harbor.szymonrichert.pl/containers/agents-schedule
  # CI-published sha7 tag, equal to the chart appVersion.
  tag: 6cfa955

# Connection URI from the CNPG app Secret made by the agents-schedule-db release.
postgres:
  existingSecret: agents-schedule-db-cluster-app
  existingSecretKey: uri

# The service token (orchestrator.token) comes from default.secrets.yaml (SOPS). Port 8002 takes
# bearer service tokens; the orchestrator's port 8000 would answer 403 from its CIDR allowlist.
orchestrator:
  url: http://agents-orchestrator-services:8002

env:
  # Only the oauth2-proxy sidecar (podAnnotations below) reaches the api, over 127.0.0.1.
  # Widening this bypasses SSO.
  SCHED_ALLOWED_CIDRS: 127.0.0.1/32

# SSO (oauth2-proxy admission webhook) on the api pod only, as for agents-orchestrator.
components:
  api:
    podAnnotations:
      oauth2-proxy-admission/enable: "true"
      oauth2-proxy-admission/redeem-url: "http://keycloak.authentication.svc.cluster.local/realms/master/protocol/openid-connect/token"
      oauth2-proxy-admission/secret-name: agents-orchestrator-proxy
      oauth2-proxy-admission/secret-namespace: agents

# Shares the lab host and its certificate with agents-orchestrator (agents-orchestrator-tls, owned
# by that release's cert-manager annotation), so no cert-manager annotation here.
ingress:
  enabled: true
  className: nginx
  # Cluster node IPs (kubectl get nodes -o wide): agent pods egress SNATed to these.
  denySourceRanges:
    - 192.168.1.26/32
    - 192.168.1.27/32
    - 192.168.1.28/32
    - 192.168.1.29/32
    - 192.168.1.65/32
  hosts:
    - host: lab.szymonrichert.pl
      paths:
        - path: /schedules
          pathType: Prefix
  tls:
    - secretName: agents-orchestrator-tls
      hosts:
        - lab.szymonrichert.pl

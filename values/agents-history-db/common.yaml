version:
  # renovate: image=ghcr.io/cloudnative-pg/postgresql
  postgresql: "16"

cluster:
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
  enablePDB: false
  instances: 1
  storage:
    size: 10Gi
    storageClass: rook-ceph

  walStorage:
    enabled: true
    size: 20Gi
    storageClass: rook-ceph

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

  monitoring:
    enabled: false

  # CNPG generates the agents-history-db-cluster-app Secret (uri, host, port,
  # dbname, user, password); the agents-history release reads it.
  # The api's first migration runs CREATE EXTENSION IF NOT EXISTS pg_trgm (a trusted extension, so
  # the database owner may create it). If CNPG refuses it, add
  # postInitApplicationSQL: ["CREATE EXTENSION IF NOT EXISTS pg_trgm"] here.
  initdb:
    database: history
    owner: history

backups:
  enabled: true
  provider: s3
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  s3:
    region: eu-central-1
    bucket: database-backup-szymonrychu
    path: /agents-history-db/
    # accessKey / secretKey come from default.secrets.yaml (SOPS)
  # Archive WAL 8 segments at a time; maxParallel 1 left the archiver ~8 GB behind.
  wal:
    maxParallel: 8
  retentionPolicy: "30d"
  scheduledBackups:
    - name: daily-backup
      schedule: "0 0 3 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io

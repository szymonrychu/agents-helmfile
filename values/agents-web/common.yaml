image:
  repository: harbor.szymonrichert.pl/containers/agents-web
  # CI-published sha7 tag, equal to the chart appVersion.
  tag: "586344d"

# Same oauth2-proxy admission webhook identity as the orchestrator api pod.
podAnnotations:
  oauth2-proxy-admission/enable: "true"
  oauth2-proxy-admission/redeem-url: "http://keycloak.authentication.svc.cluster.local/realms/master/protocol/openid-connect/token"
  oauth2-proxy-admission/secret-name: agents-orchestrator-proxy
  oauth2-proxy-admission/secret-namespace: agents

# Served as /config.json: the UI reaches the orchestrator on the same origin under /api.
backends:
  - id: orchestrator
    label: Orchestrator
    basePath: /api/v1
  - id: webhooks
    label: Webhooks
    basePath: /webhooks/api/v1
  - id: schedules
    label: Schedules
    basePath: /schedules/api/v1

# The UI owns "/" of the host. The orchestrator ingress owns /api and the only
# cert-manager annotations, so there is one Certificate for agents-orchestrator-tls.
ingress:
  enabled: true
  className: nginx
  # Cluster node IPs (kubectl get nodes -o wide): agent pods egress SNATed to these.
  denySourceRanges:
    - 192.168.1.26/32
    - 192.168.1.27/32
    - 192.168.1.28/32
    - 192.168.1.29/32
    - 192.168.1.65/32
  hosts:
    - host: lab.szymonrichert.pl
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: agents-orchestrator-tls
      hosts:
        - lab.szymonrichert.pl

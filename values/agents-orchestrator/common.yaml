image:
  repository: harbor.szymonrichert.pl/containers/agents-orchestrator
  # Release tag X.Y.Z (git tag vX.Y.Z), never a sha7: Harbor retention prunes sha7 tags.
  tag: "7.5.1"

# claude-code-wrapper image of the agent pods (becomes ORCH_AGENT_IMAGE). A release tag: Harbor
# prunes the sha7 tags, so a sha7 pin stops pulling.
agentImage: harbor.szymonrichert.pl/containers/claude-code-wrapper:0.13.0

# Docker-in-Docker sidecar for sessions with docker: true. Semver-pinned dind image pulled through
# the Harbor Docker Hub proxy project with the existing regcred pull secret; caps are the chart defaults.
docker:
  image: harbor.szymonrichert.pl/proxy-dockerhub/library/docker:29.9.2-dind

# Connection URI from the CNPG app Secret made by the agents-orchestrator-db release.
# No password in plain values.
postgres:
  existingSecret: agents-orchestrator-db-cluster-app
  existingSecretKey: uri

# Service port for in-cluster callers (agents-webhook); the token hashes are in the secrets files.
serviceApi:
  port: 8002
  # Per-caller route scopes. The vault lists presets (attachments) and sessions: its sweeper must
  # list sessions to release the pins of discarded sessions (the orchestrator calls DELETE /pins
  # only on a failed create).
  scopes:
    agents-vault:
      - GET /api/v1/presets
      - GET /api/v1/sessions

# masterKey.value and claude.token come from default.secrets.yaml (SOPS).

# Chat upstream of the agent chat relay: the connector's agent listener Service. The bearer
# (chat.token) comes from chat-token.secrets.yaml (SOPS); the connector holds only its sha256.
chat:
  url: http://agents-matrix-connector-api-agents:8001

# Agent usage forwarding: every agent pod's wrapper sends its statusLine rate_limits to the
# agents-usage ingest listener (config section `usage`, token env CCW_USAGE_TOKEN from this Secret,
# made by scripts/bootstrap-secrets.sh). The default agent image (agentImage and every
# ORCH_AGENT_IMAGES entry) must be claude-code-wrapper >= 0.8.0 while this is set: an older wrapper
# refuses the usage config section (tests/test_orchestrator_release.py guards it).
agentUsage:
  url: http://agents-usage:8002
  secretName: agents-usage-ingest

# Usage gate upstream: the agents-usage service Service (port 8001). The bearer (usage.token) comes
# from usage-token.secrets.yaml (SOPS); agents-usage holds it in its service tokens Secret. The chart
# fails the render for a token without this URL, so both land together. The gate is fail-open while
# agents-usage is down or its data is missing or stale. Quotas default to 95
# (usageQuotaDefault below; a metric gates at percent >= quota) and are set per preset by the
# user (usage_quota), not here.
usage:
  url: http://agents-usage:8001

# Default usage quota percent of a session without its own usage_quota (ORCH_USAGE_QUOTA_DEFAULT):
# a metric gates at percent >= quota, so 95 keeps headroom below the plan limit.
usageQuotaDefault: 95

# Taskboard relay upstream: the agents-taskboard service listener (port 8002). The bearer
# (taskboard.token) comes from taskboard-token.secrets.yaml (SOPS); agents-taskboard holds the same
# value as relayToken. The chart fails the render for a url without a token source.
taskboard:
  url: http://agents-taskboard-service:8002

# Vault upstream (secret references in session specs): the agents-vault service listener (port 8002).
# The bearer (vault.token) comes from vault-token.secrets.yaml (SOPS); agents-vault holds the same
# value in its service tokens Secret. No needs on agents-vault (it needs the orchestrator): a down
# vault answers 503 on creates and saves with refs only.
vault:
  url: http://agents-vault-service:8002

# Seconds between two restarts an agent asks for on its own session.
selfRestartCooldownSeconds: 600

# Superleader admin relay upstreams: the webhook and schedule admin listeners (port 8001); the
# tokens (admin.webhook.token, admin.schedule.token) come from default.secrets.yaml (SOPS). The
# connector reuses the chat AgentGate: same url and the chat token Secret the chart makes.
admin:
  webhook:
    url: http://agents-webhook-api:8001
  schedule:
    url: http://agents-schedule-api:8001
  connector:
    url: http://agents-matrix-connector-api-agents:8001
    existingSecret: agents-orchestrator-chat
    existingSecretKey: chat-token
  # The agents-history service listener (port 8001); the bearer (admin.history.token) comes from
  # history-token.secrets.yaml (SOPS), agents-history holds the same value as its service token.
  history:
    url: http://agents-history:8001

# Pre-discard settings hook: every discard POSTs the session export to the agents-history ingest
# listener before anything is deleted. The bearer is the Secret agents-history-ingest (made by
# scripts/bootstrap-secrets.sh, it must exist before the orchestrator pod rolls), reaching only the
# reconciler container as ORCH_DISCARD_HOOK_TOKEN; it differs from the history service token.
discardHook:
  url: http://agents-history:8002/history/v1/ingest
  existingSecret: agents-history-ingest
  existingSecretKey: token

env:
  # A big session export can take minutes to ingest; the chart default is 120 s.
  ORCH_DISCARD_HOOK_TIMEOUT_SECONDS: "600"
  # A big export needs minutes to ingest; user decision 2026-11-03 (T-26 D98), the orchestrator chart defaults are 30 and 60 s.
  ORCH_DISCARD_HOOK_READ_TIMEOUT_SECONDS: "300"
  ORCH_DISCARD_HOOK_PASS_BUDGET_SECONDS: "300"
  # The oauth2-proxy sidecar (podAnnotations below) is the only way in: it reaches the api over
  # 127.0.0.1, and so does `kubectl port-forward` (scripts/smoke.sh). Ingress and agent pods
  # reach the api port only through the sidecar's SSO.
  ORCH_ALLOWED_CIDRS: 127.0.0.1/32
  ORCH_AGENT_IMAGES: harbor.szymonrichert.pl/containers/claude-code-wrapper:0.13.0
  # WebSocket upgrades must carry an Origin in this list: the UI origin (the ingress host over https).
  ORCH_ALLOWED_ORIGINS: https://lab.szymonrichert.pl
  # Every new session starts with any-mcp, installed by the rendered onStart hook (pinned tag).
  ORCH_ANY_MCP_REPO: https://github.com/szymonrychu/any-mcp
  ORCH_ANY_MCP_REF: v0.5.0
  # The reserved orchestrator plugin (the orchestrator tools) is installed from this repo at this tag.
  ORCH_ANY_MCP_PLUGINS_REPO: https://github.com/szymonrychu/any-mcp-tatara-plugins
  ORCH_ANY_MCP_PLUGINS_REF: v0.32.1
  # Seconds a session with a requested self-close idles before the sweeper discards it, so readers
  # of the final answer get it first (orchestrator bounds 10..3600, default 30).
  ORCH_CLOSE_GRACE_SECONDS: "30"
  # Inactivity limits: a session with no activity gets a reminder after 1 h and is closed after
  # 4 h (reminder < close); the leader gets 5 min after the close notice to hand off. 0 turns a limit
  # off. Per-preset overrides are `spec.inactivity`; superleaders are exempt.
  ORCH_INACTIVITY_REMINDER_SECONDS: "3600"
  ORCH_INACTIVITY_CLOSE_SECONDS: "14400"
  ORCH_INACTIVITY_HANDOFF_SECONDS: "300"
  ORCH_SESSION_REPLY_WINDOW_SECONDS: "86400"

# Keycloak SSO via the oauth2-proxy admission webhook (same shape as the infrastructure
# helmfile's searxng/comfyui). The agents-orchestrator-proxy Secret is created by the
# infrastructure repo's terraform/keycloak. Annotations go on the api pod only: the
# webhook rejects annotated pods whose first container has no ports (the other three).
# The webhook gives the port name `http` to its sidecar: probe the api port by number.
components:
  api:
    podAnnotations:
      oauth2-proxy-admission/enable: "true"
      oauth2-proxy-admission/redeem-url: "http://keycloak.authentication.svc.cluster.local/realms/master/protocol/openid-connect/token"
      oauth2-proxy-admission/secret-name: agents-orchestrator-proxy
      oauth2-proxy-admission/secret-namespace: agents
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8000
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8000

# This Ingress owns the agents-orchestrator-tls Certificate (the cert-manager annotations);
# the agents-web and agents-webhook Ingresses share the Secret without them.
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
    # SSE streams stay open.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  # Cluster node IPs (kubectl get nodes -o wide): agent pods egress SNATed to these.
  denySourceRanges:
    - 192.168.1.26/32
    - 192.168.1.27/32
    - 192.168.1.28/32
    - 192.168.1.29/32
    - 192.168.1.65/32
  hosts:
    - host: lab.szymonrichert.pl
      paths:
        - path: /api
          pathType: Prefix
  tls:
    - secretName: agents-orchestrator-tls
      hosts:
        - lab.szymonrichert.pl

# Workspace cache on rook-ceph. The bucket and the Secret (AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY) come from the ObjectBucketClaim agents-workspace-cache in
# raw/workspace-cache-bucket.pre.yaml; no key in plain values.
cache:
  s3:
    endpoint: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
    region: us-east-1
    bucket: agents-workspace-cache
    pathStyle: true
    existingSecret: agents-workspace-cache
    # The api pod reads the same Secret (one S3 identity): without it the archives routes answer 503.
    api:
      existingSecret: agents-workspace-cache
  # Cleanup sweep of stale archives. These values are the seed the orchestrator uses until the policy is saved
  # in Settings > Backups; after that the database row wins. Real deletes: the user enabled it (dryRun false) on 2026-11-01.
  sweep:
    enabled: true
    dryRun: false
    retentionDays: 30
    keepNewest: 3
    intervalSeconds: 21600

# Sessions with kube_cluster_access get Kubernetes API access through a per-session identity (T-55).
kubeClusterAccess:
  enabled: true
# Namespace-scoped access for sessions with kube_namespace_access (T-55).
kubeNamespaceAccess:
  namespaces: [media]
  tiers: [read, port-forward, exec, edit, admin]

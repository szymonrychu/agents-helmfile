version:
  postgresql: "16"

cluster:
  # renovate: image=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15-standard-bookworm@sha256:4f151a9907fd7e8e487e4dc28c53e84b3bced2bd77a1590c0daaf237bd9bc4d9
  # The barman cloud plugin sidecar image comes through the Harbor proxy.
  imagePullSecrets:
    - name: regcred
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
  # Kept hibernated as the pre-rename copy (PVCs and S3 backups retained). Delete
  # only on a user decision; remove this annotation to wake it.
  annotations:
    cnpg.io/hibernation: "on"
  enablePDB: false
  instances: 1
  storage:
    size: 5Gi
    storageClass: rook-ceph

  walStorage:
    enabled: true
    size: 2Gi
    storageClass: rook-ceph

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

  monitoring:
    enabled: false

  # CNPG generates the agent-orchestrator-db-cluster-app Secret (uri, host, port,
  # dbname, user, password); the agent-orchestrator release reads it.
  initdb:
    database: agent_orchestrator
    owner: agent_orchestrator

backups:
  enabled: true
  provider: s3
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  s3:
    region: eu-central-1
    bucket: database-backup-szymonrychu
    path: /agent-orchestrator-db/
    # accessKey / secretKey come from default.secrets.yaml (SOPS)
  retentionPolicy: "30d"
  scheduledBackups: []

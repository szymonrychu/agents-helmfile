image:
  repository: harbor.szymonrichert.pl/containers/agents-taskboard
  # Release tag X.Y.Z (git tag vX.Y.Z), never a sha7: Harbor retention prunes sha7 tags.
  tag: "0.1.1"

# Base URL of agents-web: notices link to <publicUrl>/tasks/<key>.
publicUrl: https://lab.szymonrichert.pl

# Connection URI from the CNPG app Secret made by the agents-taskboard-db release.
postgres:
  existingSecret: agents-taskboard-db-cluster-app
  existingSecretKey: uri

# The notifier's service token (orchestrator.token) comes from default.secrets.yaml (SOPS); the
# orchestrator holds its sha256. Port 8002 takes bearer service tokens; the orchestrator's port
# 8000 would answer 403 from its CIDR allowlist. The same url and token serve the notifier's
# post_message and its session label lookup.
orchestrator:
  url: http://agents-orchestrator-services:8002

# The relay token (relayToken) comes from relay-token.secrets.yaml (SOPS); the orchestrator holds
# the same value as taskboard.token. It is a different secret from the service token above.

# The delegate token list (delegateTokens) comes from delegate-token.secrets.yaml (SOPS) and renders
# the in-namespace delegate component (port 8003, no ingress, no oauth2): the agents-app-connector
# relays the Tasks tab of the device app to it, as a user. The connector holds the same value as
# taskboard.token; it differs from the relay token above.

# Only the oauth2-proxy sidecar (podAnnotations below) reaches the web api, over 127.0.0.1.
# Widening this bypasses SSO.
allowedCidrs:
  - 127.0.0.1/32

# SSO (oauth2-proxy admission webhook) on the web pod only; the service listener (orchestrator
# relay, bearer token) and the notifier stay unannotated.
components:
  web:
    podAnnotations:
      oauth2-proxy-admission/enable: "true"
      oauth2-proxy-admission/redeem-url: "http://keycloak.authentication.svc.cluster.local/realms/master/protocol/openid-connect/token"
      oauth2-proxy-admission/secret-name: agents-orchestrator-proxy
      oauth2-proxy-admission/secret-namespace: agents

# Shares the lab host and its certificate with agents-orchestrator (agents-orchestrator-tls, owned
# by that release's cert-manager annotation), so no cert-manager annotation here.
ingress:
  enabled: true
  className: nginx
  # The chart has no denySourceRanges key, so the ingress-nginx denylist is set directly. The
  # cluster node IPs (kubectl get nodes -o wide): agent pods egress SNATed to these.
  annotations:
    nginx.ingress.kubernetes.io/denylist-source-range: "192.168.1.26/32,192.168.1.27/32,192.168.1.28/32,192.168.1.29/32,192.168.1.65/32"
  hosts:
    - host: lab.szymonrichert.pl
      paths:
        - path: /taskboard
          pathType: Prefix
  tls:
    - secretName: agents-orchestrator-tls
      hosts:
        - lab.szymonrichert.pl

image:
  repository: harbor.szymonrichert.pl/containers/agents-history
  # Release tag X.Y.Z (git tag vX.Y.Z), never a sha7: Harbor retention prunes sha7 tags.
  tag: "0.1.2"

# Connection URI from the CNPG app Secret made by the agents-history-db release.
postgres:
  existingSecret: agents-history-db-cluster-app
  existingSecretKey: uri

# Token-gated service listener (read and search; the orchestrator relay). The tokens Secret is
# values/agents-history/raw/service-tokens.agents-history.pre.secrets.yaml (SOPS); the orchestrator
# holds the same token in values/agents-orchestrator/history-token.secrets.yaml (ORCH_HISTORY_TOKEN).
serviceListener:
  enabled: true
  tokensSecret:
    name: agents-history-service-tokens
    key: tokens

# Token-gated ingest listener (the orchestrator's session export delivery at discard). The token
# Secret is values/agents-history/raw/ingest-token.agents-history.pre.secrets.yaml (SOPS); it must
# differ from the service token (the service exits 78 otherwise).
ingestListener:
  enabled: true
  tokensSecret:
    name: agents-history-ingest
    key: token

env:
  # Only the oauth2-proxy sidecar (podAnnotations below) reaches the api, over 127.0.0.1.
  # Widening this bypasses SSO.
  HISTORY_ALLOWED_CIDRS: 127.0.0.1/32

# SSO (oauth2-proxy admission webhook) on the api pod only, as for agents-orchestrator.
components:
  api:
    podAnnotations:
      oauth2-proxy-admission/enable: "true"
      oauth2-proxy-admission/redeem-url: "http://keycloak.authentication.svc.cluster.local/realms/master/protocol/openid-connect/token"
      oauth2-proxy-admission/secret-name: agents-orchestrator-proxy
      oauth2-proxy-admission/secret-namespace: agents
      oauth2-proxy-admission/api-routes: "^/(api|history|schedules|taskboard|usage|vault|mindmap|matrix/api|webhooks/api|app/admin)(/|$)"

# Shares the lab host and its certificate with agents-orchestrator (agents-orchestrator-tls, owned
# by that release's cert-manager annotation), so no cert-manager annotation here.
ingress:
  enabled: true
  className: nginx
  # Cluster node IPs (kubectl get nodes -o wide): agent pods egress SNATed to these.
  denySourceRanges:
    - 192.168.1.26/32
    - 192.168.1.27/32
    - 192.168.1.28/32
    - 192.168.1.29/32
    - 192.168.1.65/32
  hosts:
    - host: lab.szymonrichert.pl
      paths:
        - path: /history
          pathType: Prefix
  tls:
    - secretName: agents-orchestrator-tls
      hosts:
        - lab.szymonrichert.pl

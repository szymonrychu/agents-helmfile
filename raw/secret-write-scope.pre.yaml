# Secret write scope in namespace agents (admissionregistration.k8s.io/v1, GA since Kubernetes 1.30;
# the repo pins kubectl 1.33). Applied by .hook.sh at presync of any release.
# The chart Roles grant create, patch and delete on every Secret (the names are dynamic, so
# resourceNames cannot narrow them). This policy narrows the writes by name prefix, per ServiceAccount:
#   agents-vault                  vault-<entry id>-v<n>        (agents-vault k8s.secret_name)
#   agents-orchestrator-api       ps-<preset>-<digest>-v<n>    (preset secrets, k8s/secrets.secret_name)
#                                 webhook-<id>-password        (webhook credentials)
#   agents-orchestrator-reconciler agent-<slug>-ccw            (per-session Secret, k8s/labels.object_names)
# Other users and ServiceAccounts are not matched (matchConditions). On DELETE the name comes from
# oldObject. Add a prefix here whenever one of these services starts writing a new Secret name.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agents-secret-write-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
  matchConditions:
    - name: scoped-service-accounts
      expression: >-
        request.userInfo.username in [
        'system:serviceaccount:agents:agents-vault',
        'system:serviceaccount:agents:agents-orchestrator-api',
        'system:serviceaccount:agents:agents-orchestrator-reconciler']
  variables:
    - name: user
      expression: request.userInfo.username
    - name: target
      expression: "request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name"
  validations:
    - expression: >-
        variables.user != 'system:serviceaccount:agents:agents-vault'
        || variables.target.startsWith('vault-')
      messageExpression: "'this service account may only write Secrets named vault-*, not ' + variables.target"
      reason: Forbidden
    - expression: >-
        variables.user != 'system:serviceaccount:agents:agents-orchestrator-api'
        || variables.target.startsWith('ps-')
        || variables.target.startsWith('webhook-')
      messageExpression: "'this service account may only write Secrets named ps-* or webhook-*, not ' + variables.target"
      reason: Forbidden
    - expression: >-
        variables.user != 'system:serviceaccount:agents:agents-orchestrator-reconciler'
        || variables.target.startsWith('agent-')
      messageExpression: "'this service account may only write Secrets named agent-*, not ' + variables.target"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agents-secret-write-scope
spec:
  policyName: agents-secret-write-scope
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: agents
